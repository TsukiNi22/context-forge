// -----------------------------------------------------------------
// 02_full_chain.cfg
// One trigger (bin + contains combined), one pre-rule (ansi),
// and every rule plugin chained in sequence on the same group.
// Order matters: drop -> dup -> replace -> ln -> insert.
// -----------------------------------------------------------------

trigger = {
    bin      = ["grep", "rg"];
    contains = "match";
};

ansi = false; // strip color codes before the rules run


    // 1. drop empty lines
    drop = ["^\\s*$"];

    // 2. collapse repeated "Binary file ... matches" noise
    dup = {
        match  = ["^Binary file .* matches$"];
        keep   = 1;
        invert = false;
    };

    // 3. flag TODOs inline
    replace = {
        match = ["\\bTODO\\b"];
        by    = "[TODO -> <INSERT>]";
    };

    // 4. keep only the last 50 lines
    ln = {
        tail = 50;
    };

    // 5. wrap the whole output
    insert = {
        before = "----- grep output -----\n";
        after  = "\n----- end -----\n";
    };
