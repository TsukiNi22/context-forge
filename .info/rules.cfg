// add a check mode for rules/other
// allow to clone file usibng --clone into a custom dir

// allow the rule to be ingored
enable = <boolean>

// trigger of the rule (optional, if nothing trigger on all)
trigger = {
    // all var optional
    bin = ["<bin>", ...];
    contains = "<regex>";
    match = "<regex>";
};

// rules (each one is optional)
ansi = <boolean>; // keep ansi sequance or remove them

// separate by block the formating (default: one block / all)
block = {
    // only one of the tow
    ln = <int>; // number of line | int >= 0
    char = <int>; // number of chars | int >= 0

    show = <int>; // number of block displayed
    sep = "<string>"; // separator writted between each block during display
};

ln = {
    // all var optional (head apply before tail)
    head = <int>; // pos: keep n line | neg: remove n line
    tail = <int>; // pos: keep n line | neg: remove n line
};

// drop any thing that match it after the first match
dup = {
    // all var optional
    match = ["<regex>", "<regex>", ...]
    eq = ["<string>", "<string>", ...]

    keep = <int>; // keep n first match, default: 1
    invert = <boolean>; // keep last (true) or first (false), default: first
};

// replace match by other
replace = {
    // all var optional
    match = ["<regex>", "<regex>", ...]
    eq = ["<string>", "<string>", ...]

    by = "<string>"; // special sequence '<INSERT>' will be replaced by the match
};

// remove anything that match
drop = ["<regex>", "<regex>", ...]

// any custom one using plugins *.so


hard coded:
 - enable
 - block

spe rules:
 - (trigger) trigger
 - (pre) ansi

rules:
 - ln
 - dup
 - replace
 - drop
